name: Build ImmortalWrt-25.12 for armsr_armv8

on:
  workflow_dispatch:

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: v25.12.2
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Initialize environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update > /dev/null
          sudo -E apt-get -qq install -y $(curl -fsSL https://raw.githubusercontent.com/nantayo/My-Pkg/master/openwrt) > /dev/null
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir

      - name: Clone source code
        working-directory: /workdir
        run: |
          git clone $REPO_URL -b $REPO_BRANCH --single-branch --depth=1 openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
          echo "FILE_DATE=$(date +"%Y%m%d")" >> $GITHUB_ENV

      - name: Update & Install feeds
        working-directory: ./openwrt
        run: |
          ./scripts/feeds update -a
          bash $GITHUB_WORKSPACE/armsr/armv8/diy/diy.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load custom config
        run: |
          rm -rf openwrt/files openwrt/.config
          mv armsr/armv8/jp-tvbox/files armsr/armv8/jp-tvbox/.config openwrt/
          chmod -R 755 openwrt

      - name: Download package
        working-directory: ./openwrt
        run: |
          make defconfig
          make download -j$(( $(nproc) * 2 ))

      - name: Compile firmware
        working-directory: ./openwrt
        run: |
          make -j$(( $(nproc) + 1 )) || make -j1 V=s

      - name: Package firmware
        uses: ophub/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: openwrt/bin/targets/armsr/armv8/*rootfs.tar.gz
          openwrt_board: rk3566
          kernel_usage: flippy
          openwrt_kernel: 6.18.y
          kernel_tags: 6.18.y
          openwrt_size: 256/2048
          builder_name: xunmoo

      - name: Upload firmware to release
        run: |
          tag="OpenWrt_${{ env.FILE_DATE }}"
          gh release create $tag --repo ${{ github.repository }} --title "$tag" --notes "$(printf '首次使用建议全新刷写\n* 基本信息\nIP: 192.168.50.2\n账户: root\n密码: password')" 2> /dev/null || true
          gh release upload $tag ${{ env.PACKAGED_OUTPUTPATH }}/*.img.gz --repo ${{ github.repository }} --clobber

      - name: Delete old releases
        run: |
          gh release list --repo ${{ github.repository }} --limit 100 --json tagName --jq '.[].tagName' | tail -n +3 | while read -r tag; do gh release delete "$tag" --repo ${{ github.repository }} --cleanup-tag --yes; done
